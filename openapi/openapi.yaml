openapi: 3.0.3
info:
  title: SDET Store API
  version: 1.0.0
  description: >
    Small product catalogue API. It exists as the system under test for the
    Playwright suite in this repository, which validates responses against the
    schemas in this file.
servers:
  - url: http://localhost:3000
tags:
  - name: Health
  - name: Auth
  - name: Products

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and database connectivity check
      responses:
        '200':
          description: API and database are reachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Database is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a bearer token
      description: >
        Only failed attempts count towards the per-IP rate limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Unknown email or wrong password (the response is identical for both)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Too many failed attempts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - in: query
          name: search
          description: Case-insensitive substring match on the product name. Wildcards are matched literally.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Page of products, ordered by id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Products]
      summary: Create a product (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Path of the new product
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /api/v1/products/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Get one product
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Products]
      summary: Replace a product (admin only)
      description: Same body as create. Omitted optional fields fall back to their defaults.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Products]
      summary: Update some fields of a product (admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Products]
      summary: Delete a product (admin only)
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, malformed, expired or forged token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated, but the role is not allowed to do this
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No product with that id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: Request body is over the 100 kB limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable] }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 1, maxLength: 128 }

    User:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id: { type: integer, minimum: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, customer] }

    LoginResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, minLength: 20 }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: string }
        user: { $ref: '#/components/schemas/User' }

    # Fields a client can send. Price has at most 2 decimals, which JSON Schema cannot express reliably for floats.
    ProductFields:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, minimum: 0, maximum: 99999999.99 }
        stock: { type: integer, minimum: 0, maximum: 2147483647 }

    ProductInput:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - required: [name, price]

    ProductPatch:
      allOf:
        - $ref: '#/components/schemas/ProductFields'
        - minProperties: 1

    Product:
      type: object
      additionalProperties: false
      required: [id, name, description, price, stock, created_at, updated_at]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, minimum: 0, maximum: 99999999.99 }
        stock: { type: integer, minimum: 0, maximum: 2147483647 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Product' }

    ProductList:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Product' }
        pagination:
          type: object
          additionalProperties: false
          required: [total, limit, offset]
          properties:
            total: { type: integer, minimum: 0 }
            limit: { type: integer, minimum: 1, maximum: 100 }
            offset: { type: integer, minimum: 0 }
