services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sdet_store
      POSTGRES_USER: sdet
      POSTGRES_PASSWORD: sdet_password
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdet -d sdet_store"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  api:
    build: .
    # Compose is the test environment, so it migrates and seeds itself before starting.
    command: sh -c "node dist/db/migrate.js && node dist/db/seed.js && node dist/server.js"
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://sdet:sdet_password@db:5432/sdet_store
      JWT_SECRET: local-compose-secret-change-me-32-chars-min
      JWT_EXPIRES_IN: 15m
      AUTH_RATE_LIMIT_MAX: 100
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
